<!doctype html>
<html lang="id" class="bg-slate-950">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>EarFlow — Earphone Production Management System</title>
    <meta name="description" content="Aplikasi Manajemen Produksi Earphone Shift 13:00-20:00 dengan Kalkulasi Tim & Pembagian Hasil Individu Otomatis" />
    <meta name="theme-color" content="#0b0f19" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      html, body {
        background-color: #0b0f19 !important;
        color: #f9fafb;
        margin: 0;
        padding: 0;
      }
      .initial-loader {
        min-height: 100vh;
        background-color: #0b0f19;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        font-family: 'Plus Jakarta Sans', sans-serif;
      }
      .spinner {
        width: 32px;
        height: 32px;
        border: 3px solid rgba(20, 184, 166, 0.15);
        border-top-color: #14b8a6;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-teal-500 selection:text-white">
    <div id="app">
      <div class="initial-loader">
        <div class="spinner"></div>
        <span style="font-size: 11px; font-weight: 700; color: #14b8a6; letter-spacing: 1px; font-family: monospace;">EARFLOW</span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
